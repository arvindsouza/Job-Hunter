<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bengaluru job matches</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="navbar">
        <div class="brand">Bengaluru job matches</div>
        <nav class="nav-tabs" aria-label="Role">
          <button type="button" class="nav-tab is-active" data-view="em" aria-current="page">
            EM <span id="em-count" class="count">(0)</span>
          </button>
          <button type="button" class="nav-tab" data-view="tpm">
            TPM <span id="tpm-count" class="count">(0)</span>
          </button>
        </nav>
      </header>

      <main class="page">
        <p id="view-title" class="view-title">Engineering Manager</p>
        <p id="live-status" class="status">Connecting to the agent…</p>
        <section class="panel">
          <div id="jobs-table"></div>
        </section>
      </main>
    </div>

    <script src="jobs-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
