<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bengaluru job matches</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <h1>Bengaluru job matches</h1>
      <p class="subtitle">
        Software Engineering Manager and Technical Program Manager roles from the last week,
        rated against your two resumes.
      </p>
      <p id="live-status" class="status">Connecting to the agent…</p>

      <div class="tables">
        <section>
          <h2>Software Engineering Manager <span id="sem-table-count" class="count"></span></h2>
          <div id="sem-table"></div>
        </section>

        <section>
          <h2>Technical Program Manager <span id="tpm-table-count" class="count"></span></h2>
          <div id="tpm-table"></div>
        </section>
      </div>
    </main>

    <script src="jobs-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
